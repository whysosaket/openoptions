[package]
name = "openoptions"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local desktop settings for Logitech peripherals"

[dependencies]
directories = "6"
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
