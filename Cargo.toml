[package]
name = "openoptions"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Local desktop settings for Logitech peripherals"

[dependencies]
directories = "6"
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "windows-native", "macos-shared-device"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"
