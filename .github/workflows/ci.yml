name: Desktop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: rustup update stable
      - run: rustup component add rustfmt clippy --toolchain stable
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-targets
